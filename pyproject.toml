[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-pipeline"
version = "0.1.0"
description = "Modular YouTube video automation pipeline (script → audio → assets → compose)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "tenacity>=8.3.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "google-genai>=1.0.0",
  "openai>=1.35.0",
  "anthropic>=0.28.0",
  "elevenlabs>=1.3.0",
  "gTTS>=2.5.0",
  "edge-tts>=6.1.0",
  "moviepy>=2.0.0",
  "Pillow>=10.3.0",
  "numpy>=1.26.0",
  "imageio>=2.34.0",
  "imageio-ffmpeg>=0.5.1",
  "proglog>=0.1.10",
  "srt>=3.5.3",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0"]
api = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
]

[project.scripts]
youtube-pipeline = "cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["youtube_pipeline*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
